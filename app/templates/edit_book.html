<!-- templates/edit_book.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Book</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
  {% include 'nav.html' %}

  <div class="container mt-5">
    <h2>Edit Book</h2>
    <form method="post" action="{{ url_for('main.edit_book_page', id=book.id) }}">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="title">Title</label>
          <input
            id="title"
            name="title"
            class="form-control"
            value="{{ book.title }}"
            required>
        </div>
        <div class="form-group col-md-6">
          <label for="author">Author</label>
          <input
            id="author"
            name="author"
            class="form-control"
            value="{{ book.author }}"
            required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="genre">Genre</label>
          <input
            id="genre"
            name="genre"
            class="form-control"
            value="{{ book.genre }}">
        </div>
        <div class="form-group col-md-4">
          <label for="publisher">Publisher</label>
          <input
            id="publisher"
            name="publisher"
            class="form-control"
            value="{{ book.publisher }}">
        </div>
        <div class="form-group col-md-2">
          <label for="year">Year</label>
          <input
            id="year"
            name="year"
            type="number"
            class="form-control"
            value="{{ book.year }}">
        </div>
        <div class="form-group col-md-2">
          <label for="availability">Quantity</label>
          <input
            id="availability"
            name="availability"
            type="number"
            class="form-control"
            value="{{ book.availability }}">
        </div>
      </div>

      <!-- NEW Cover Image URL field -->
      <div class="form-group">
        <label for="image_url">Cover Image URL</label>
        <input
          id="image_url"
          name="image_url"
          type="url"
          class="form-control"
          placeholder="https://example.com/cover.jpg"
          value="{{ book.image_url or '' }}">
        <small class="form-text text-muted">
          Paste a web URL to the book’s cover image (optional).
        </small>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          rows="4"
          class="form-control"
          placeholder="Enter a short synopsis…">{{ book.description or '' }}</textarea>
      </div>

      <button type="submit" class="btn btn-primary">Update Book</button>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary ml-2">Back to Dashboard</a>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
