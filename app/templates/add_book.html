<!-- templates/add_book.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a New Book</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
  {% include 'nav.html' %}
  <div class="container mt-5">
    <h2>Add Book</h2>
    <form method="post" action="{{ url_for('main.add_book_page') }}">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>Title</label>
          <input name="title" class="form-control" required>
        </div>
        <div class="form-group col-md-6">
          <label>Author</label>
          <input name="author" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label>Genre</label>
          <input name="genre" class="form-control">
        </div>
        <div class="form-group col-md-4">
          <label>Publisher</label>
          <input name="publisher" class="form-control">
        </div>
        <div class="form-group col-md-2">
          <label>Year</label>
          <input name="year" type="number" class="form-control">
        </div>
        <div class="form-group col-md-2">
          <label>Quantity</label>
          <input name="availability" type="number" class="form-control" value="1">
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="4" class="form-control"
                  placeholder="Enter a short synopsis…"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Add Book</button>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
