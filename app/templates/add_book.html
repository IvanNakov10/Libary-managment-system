<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add a New Book</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
  {% include 'nav.html' %}
  <div class="container mt-5">
    <h2>Add Book</h2>
    <form method="post" action="{{ url_for('main.add_book_page') }}">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="title">Title</label>
          <input id="title" name="title" class="form-control" required>
        </div>
        <div class="form-group col-md-6">
          <label for="author">Author</label>
          <input id="author" name="author" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="genre">Genre</label>
          <input id="genre" name="genre" class="form-control">
        </div>
        <div class="form-group col-md-4">
          <label for="publisher">Publisher</label>
          <input id="publisher" name="publisher" class="form-control">
        </div>
        <div class="form-group col-md-2">
          <label for="year">Year</label>
          <input id="year" name="year" type="number" class="form-control">
        </div>
        <div class="form-group col-md-2">
          <label for="availability">Quantity</label>
          <input id="availability" name="availability" type="number" class="form-control" value="1">
        </div>
      </div>

      <div class="form-group">
        <label for="image_url">Cover Image URL</label>
        <input
          id="image_url"
          name="image_url"
          type="url"
          class="form-control"
          placeholder="https://example.com/cover.jpg">
        <small class="form-text text-muted">
          Paste a web URL to the book’s cover image (optional).
        </small>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          rows="4"
          class="form-control"
          placeholder="Enter a short synopsis…"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Add Book</button>
      <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
